services:
  claudable:
    build:
      context: .
      network: host
    image: claudable:dev
    init: true
    user: "${HOST_UID:?set HOST_UID in .env.docker (id -u) and start with: docker compose --env-file .env.docker up}:${HOST_GID:?set HOST_GID in .env.docker (id -g) and start with: docker compose --env-file .env.docker up}"
    env_file:
      - .env.docker
    network_mode: host
    environment:
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env.docker (32-byte hex, generator in the comment there) and start with: docker compose --env-file .env.docker up}"
      PROJECTS_DIR: /data/projects
      DATABASE_URL: file:/data/cc.db
      SETTINGS_DIR: /data
      PREVIEW_PORT_START: "3100"
      PREVIEW_PORT_END: "3131"
      CLAUDE_CONFIG_DIR: /data/home/.claude
    volumes:
      - ${CLAUDABLE_DATA:-./data}:/data
      - ${CLAUDABLE_CLAUDE_DIR:-${HOME}/.claude}:/data/home/.claude
      - ${HOME}/.figma-console-mcp:/data/home/.figma-console-mcp
      - ${HOME}/.claude.json:/data/home/.claude.json
